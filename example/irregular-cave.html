<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Irregular Cave</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300&display=swap"
            rel="stylesheet"
        />
        <style>
            body {
                background: whitesmoke;
                color: black;
                font-family:
                    "DM Mono", ui-monospace, Menlo, Consolas, monospace;
                font-size: 9pt;
                font-weight: normal;
                margin: 24px;
            }
            .page {
                background: white;
                box-sizing: border-box;
                display: flex;
                height: 210mm;
                padding: 2.5mm;
                width: 297mm;
            }
            .map {
                display: flex;
                flex-direction: column;
            }
            .row {
                display: flex;
            }
            .row img {
                display: block;
                height: 20mm;
                width: 20mm;
            }
            .sidebar {
                flex: 1;
                padding: 8mm 10mm 8mm 5mm;
                display: flex;
                flex-direction: column;
                gap: 0;
            }
            .sidebar pre {
                margin: 0;
                white-space: pre-wrap;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <div class="page">
            <div class="map">
                <!-- Row 0: top perimeter steps in at col 2; entrance col 7 -->
                <div class="row">
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/corner-nw-01.svg" />
                    <img src="../assets/wall-h-01.svg" />
                    <img src="../assets/wall-h-02.svg" />
                    <img src="../assets/wall-h-03.svg" />
                    <img src="../assets/wall-h-04.svg" />
                    <img src="../assets/entrance.svg" />
                    <img src="../assets/wall-h-05.svg" />
                    <img src="../assets/corner-ne-01.svg" />
                </div>
                <!-- Row 1: left perimeter jogs out — NW--SE shelf at cols 0–2 -->
                <div class="row">
                    <img src="../assets/corner-nw-02.svg" />
                    <img src="../assets/wall-h-01.svg" />
                    <img src="../assets/corner-se-01.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/wall-v-01.svg" />
                </div>
                <!-- Row 2: open chamber between left & right perimeter -->
                <div class="row">
                    <img src="../assets/wall-v-02.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/wall-v-03.svg" />
                </div>
                <!-- Row 3: left wall steps east — SW corner, top of shelf to col 5 NE -->
                <div class="row">
                    <img src="../assets/corner-sw-01.svg" />
                    <img src="../assets/wall-h-02.svg" />
                    <img src="../assets/wall-h-03.svg" />
                    <img src="../assets/wall-h-04.svg" />
                    <img src="../assets/wall-h-05.svg" />
                    <img src="../assets/corner-ne-02.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/wall-v-04.svg" />
                </div>
                <!-- Row 4: shelf underside — NW at col 2, SE at col 5 -->
                <div class="row">
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/corner-nw-03.svg" />
                    <img src="../assets/wall-h-01.svg" />
                    <img src="../assets/wall-h-02.svg" />
                    <img src="../assets/corner-se-02.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/wall-v-05.svg" />
                </div>
                <!-- Row 5: left perimeter steps back west; tiny NW/SE pocket at cols 8–9 -->
                <div class="row">
                    <img src="../assets/corner-nw-04.svg" />
                    <img src="../assets/wall-h-03.svg" />
                    <img src="../assets/corner-se-03.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/corner-nw-01.svg" />
                    <img src="../assets/corner-se-04.svg" />
                </div>

                <div class="row">
                    <img src="../assets/wall-v-01.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/corner-nw-02.svg" />
                    <img src="../assets/wall-h-04.svg" />
                    <img src="../assets/wall-h-05.svg" />
                    <img src="../assets/wall-h-01.svg" />
                    <img src="../assets/corner-se-01.svg" />
                    <img src="../assets/floor.svg" />
                </div>
                <!-- Row 7: shelf underside — SE at col 4, NE at col 6 -->
                <div class="row">
                    <img src="../assets/wall-v-02.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/corner-sw-02.svg" />
                    <img src="../assets/wall-h-02.svg" />
                    <img src="../assets/corner-ne-03.svg" />
                    <img src="../assets/floor.svg" />

                    <img src="../assets/floor.svg" />
                </div>
                <!-- Row 8: SW/NE pair at cols 0–1; NW/SE pair at cols 5–6 -->
                <div class="row">
                    <img src="../assets/corner-sw-02.svg" />
                    <img src="../assets/corner-ne-04.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/corner-nw-03.svg" />
                    <img src="../assets/corner-se-03.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />

                <!-- Row 9: SW corner, exit col 1, bottom wall to SE at col 4 -->
                <div class="row">
                    <img src="../assets/floor.svg" />
                    <img src="../assets/corner-sw-03.svg" />
                    <img src="../assets/exit.svg" />
                    <img src="../assets/wall-h-03.svg" />
                    <img src="../assets/wall-h-04.svg" />
                    <img src="../assets/corner-se-04.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                    <img src="../assets/floor.svg" />
                </div>
            </div>
            <div class="sidebar">
                <h2
                    style="
                        font-size: inherit;
                        font-weight: inherit;
                        margin: 0 0 8px;
                    "
                >
                    Irregular Cave
                </h2>
                <p style="line-height: 1.6; margin: 0 0 16px">
                    Enter top-right, drop down the right corridor past two
                    jagged shelves jutting in from the left, then turn west
                    across the bottom and slip out the south exit. The cave's
                    south and east walls fray into open rock — there is no clean
                    perimeter on that side.
                </p>
            </div>
        </div>
    </body>
</html>
