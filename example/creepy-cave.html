                gap: 0;

            .sidebar pre {

                <p style="line-height: 1.6; margin: 0 0 16px">
                    Enter through the broken upper wall, pick your way between
                    paired rock clusters, then hook left to the low south exit.
                    The cave keeps making faces in the corners. Try not to look
